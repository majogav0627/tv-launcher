name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # necesario para crear la Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret KEYSTORE_BASE64. Revisa el README (sección Firma)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK firmado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk "Inicio-v${VERSION}.apk"

      - name: Borrar la clave del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inicio-v${{ env.VERSION }}
          path: Inicio-v${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Inicio v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Inicio-v${{ env.VERSION }}.apk
          body: |
            APK firmado de **Inicio** (launcher para Android TV).

            Instalar o actualizar desde PowerShell:
            ```
            .\adb install -r Inicio-v${{ env.VERSION }}.apk
            ```
